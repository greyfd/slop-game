<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>First-Person Terrain Demo</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body, html {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #111;
        font-family: 'Segoe UI', system-ui, sans-serif;
        color: white;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        cursor: none;
      }
      #overlay {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: rgba(0, 0, 0, 0.65);
        z-index: 10;
        gap: 16px;
        cursor: pointer;
      }
      #overlay h1 {
        font-size: 2rem;
        font-weight: 300;
        letter-spacing: 0.05em;
      }
      #overlay p {
        font-size: 0.95rem;
        opacity: 0.7;
      }
      #overlay .controls {
        margin-top: 12px;
        font-size: 0.85rem;
        opacity: 0.5;
        line-height: 1.6;
        text-align: center;
      }
      #error {
        display: none;
        position: fixed;
        inset: 0;
        justify-content: center;
        align-items: center;
        background: #111;
        color: #ff6666;
        font-size: 1.1rem;
        z-index: 20;
        padding: 2rem;
        text-align: center;
      }
      /* Crosshair */
      #crosshair {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 2px;
        height: 20px;
        background: rgba(255, 255, 255, 0.6);
        z-index: 5;
        pointer-events: none;
      }
      #crosshair::after {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 20px;
        height: 2px;
        background: rgba(255, 255, 255, 0.6);
      }
    </style>
  </head>
  <body>
    <div id="error"></div>

    <div id="overlay">
      <h1>Click to Play</h1>
      <p>Your browser must support WebGPU</p>
      <div class="controls">
        WASD - Move &nbsp;|&nbsp; Mouse - Look &nbsp;|&nbsp; Space - Jump &nbsp;|&nbsp; Esc - Release cursor
      </div>
    </div>

    <div id="crosshair"></div>

    <canvas id="canvas"></canvas>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
