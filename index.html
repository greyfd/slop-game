<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>First-Person Terrain Demo</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body, html {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #111;
        font-family: 'Segoe UI', system-ui, sans-serif;
        color: white;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        cursor: none;
      }
      #overlay {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: rgba(0, 0, 0, 0.65);
        z-index: 10;
        gap: 16px;
        cursor: pointer;
      }
      #overlay h1 {
        font-size: 2rem;
        font-weight: 300;
        letter-spacing: 0.05em;
      }
      #overlay p {
        font-size: 0.95rem;
        opacity: 0.7;
      }
      #overlay .controls {
        margin-top: 12px;
        font-size: 0.85rem;
        opacity: 0.5;
        line-height: 1.6;
        text-align: center;
      }
      #error {
        display: none;
        position: fixed;
        inset: 0;
        justify-content: center;
        align-items: center;
        background: #111;
        color: #ff6666;
        font-size: 1.1rem;
        z-index: 20;
        padding: 2rem;
        text-align: center;
      }
      #stats {
        position: fixed;
        top: 12px;
        left: 12px;
        background: rgba(0, 0, 0, 0.75);
        color: #0f0;
        padding: 8px 12px;
        font-family: monospace;
        font-size: 13px;
        z-index: 20;
        pointer-events: auto;
        border-radius: 6px;
        line-height: 1.6;
        user-select: none;
      }
      #tick-toggle {
        margin-top: 6px;
        background: #333;
        color: #fff;
        border: 1px solid #555;
        border-radius: 4px;
        padding: 4px 8px;
        cursor: pointer;
        font-family: inherit;
        font-size: 11px;
        width: 100%;
      }
      #tick-toggle:hover {
        background: #555;
      }
      /* Crosshair */
      #crosshair {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 2px;
        height: 20px;
        background: rgba(255, 255, 255, 0.6);
        z-index: 5;
        pointer-events: none;
      }
      #crosshair::after {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 20px;
        height: 2px;
        background: rgba(255, 255, 255, 0.6);
      }
      #minimap {
        position: fixed;
        top: 12px;
        right: 12px;
        width: 256px;
        height: 256px;
        background: #111;
        border: 2px solid rgba(255, 255, 255, 0.2);
        border-radius: 8px;
        z-index: 5;
        pointer-events: none;
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <div id="stats">
      <div id="fps-counter">Render: 0 FPS</div>
      <div id="hz-counter">Engine: 0 Hz</div>
      <button id="tick-toggle">Switch to 120Hz</button>
      <div style="margin-top: 12px; border-top: 1px solid #555; padding-top: 8px;">
        <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
          <input type="checkbox" id="fly-mode" /> Fly Mode
        </label>
        <label style="display: flex; align-items: center; gap: 6px; margin-top: 6px;">
          Speed: <input type="range" id="player-speed" min="5" max="100" value="10" style="width: 100px;" />
          <span id="speed-val">10</span>
        </label>
      </div>
    </div>

    <div id="error"></div>

    <div id="overlay">
      <h1>Click to Play</h1>
      <p>Your browser must support WebGPU</p>
      <div class="controls">
        WASD - Move &nbsp;|&nbsp; Mouse - Look &nbsp;|&nbsp; Space - Jump &nbsp;|&nbsp; Esc - Release cursor
      </div>
    </div>

    <div id="crosshair"></div>

    <canvas id="minimap" width="256" height="256"></canvas>
    <canvas id="canvas"></canvas>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
